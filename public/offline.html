<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | Medhaversum Gurukulam</title>
    <link rel="icon" type="image/png" href="/assets/images/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #081B38;
            color: #FFFFFF;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .offline-card {
            background: #0B234A;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 40px 30px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .logo-img {
            width: 72px;
            height: 72px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        h2 {
            font-size: 1.4rem;
            margin: 0 0 10px;
            font-weight: 700;
        }
        p {
            font-size: 0.88rem;
            color: #94A3B8;
            margin: 0 0 24px;
            line-height: 1.5;
        }
        .btn-retry {
            background: #C59B27;
            color: #081B38;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 12px 28px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }
        .btn-retry:hover {
            background: #D8AA30;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <img src="/assets/images/logo.png" alt="Logo" class="logo-img">
        <h2>You are currently offline</h2>
        <p>Please check your internet connection. Medhaversum Gurukulam CRM will automatically reconnect once your network is restored.</p>
        <button class="btn-retry" onclick="window.location.reload()">Retry Connection</button>
    </div>
</body>
</html>
